# Example Kubernetes deployment of MCPortal.
#
# Config update = rolling update (no hot reload): change the ConfigMap then restart the
# deployment (`kubectl rollout restart deploy/mcportal`), or automate it with a
# `checksum/config` annotation (Helm) or the Reloader tool.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcportal-config
data:
  registry.yaml: |
    # Content of registry.yaml (guide_path: guide-ssp.md, relative to this file), with
    # `gateway.http` overridden: registry.yaml binds to 127.0.0.1 for local runs, which would
    # make the pod unreachable. allowed_hosts stays empty: the Ingress below filters on host.
    #   gateway:
    #     http: {bind: "0.0.0.0:8000", path: /mcp, allowed_hosts: []}
  guide-ssp.md: |
    # Content of guide-ssp.md
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcportal
spec:
  replicas: 2                       # possible because the MCP server is stateless
  selector:
    matchLabels: {app: mcportal}
  template:
    metadata:
      labels: {app: mcportal}
    spec:
      # Must exceed the largest upstream `timeout` (30 s) + the preStop, to let in-flight
      # calls finish during shutdown.
      terminationGracePeriodSeconds: 45
      containers:
        - name: mcportal
          image: ghcr.io/inseefrlab/mcportal:0.1.0
          ports:
            - {name: mcp, containerPort: 8000}
            - {name: metrics, containerPort: 9090}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
          livenessProbe:            # the process responds (does not depend on upstreams)
            httpGet: {path: /health, port: mcp}
            periodSeconds: 10
          readinessProbe:           # first load done, and not shutting down
            httpGet: {path: /ready, port: mcp}
            periodSeconds: 5
          lifecycle:
            # Gives the ingress time to remove the pod before SIGTERM.
            # (Native `sleep` action: Kubernetes >= 1.30; the distroless image has no shell.)
            preStop:
              sleep: {seconds: 5}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: config
          configMap: {name: mcportal-config}
---
apiVersion: v1
kind: Service
metadata:
  name: mcportal
  labels: {app: mcportal}
spec:
  selector: {app: mcportal}
  ports:
    - {name: mcp, port: 80, targetPort: mcp}
    - {name: metrics, port: 9090, targetPort: metrics}   # do not expose through the ingress
---
# Only /mcp is exposed. /health (detailed status, upstream errors with internal URLs) and
# /ready stay reachable by the kubelet probes only; /metrics is on another port.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcportal
spec:
  rules:
    - host: mcportal.example.org          # to adapt
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend:
              service: {name: mcportal, port: {name: mcp}}
