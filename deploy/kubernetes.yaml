# Example Kubernetes deployment of MCPortal.
#
# Config update = rolling update (no hot reload): change the ConfigMap then restart the
# deployment (`kubectl rollout restart deploy/mcportal`), or automate it with a
# `checksum/config` annotation (Helm) or the Reloader tool.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcportal-config
data:
  registry.yaml: |
    # Content of registry.yaml (guide_path: guide-ssp.md, relative to this file)
  guide-ssp.md: |
    # Content of guide-ssp.md
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcportal
spec:
  replicas: 2                       # possible because the MCP server is stateless
  selector:
    matchLabels: {app: mcportal}
  template:
    metadata:
      labels: {app: mcportal}
    spec:
      # Must exceed the largest upstream `timeout` (30 s) + the preStop, to let in-flight
      # calls finish during shutdown.
      terminationGracePeriodSeconds: 45
      containers:
        - name: mcportal
          image: mcportal:0.1.0
          ports:
            - {name: mcp, containerPort: 8000}
            - {name: metrics, containerPort: 9090}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
          livenessProbe:            # the process responds (does not depend on upstreams)
            httpGet: {path: /health, port: mcp}
            periodSeconds: 10
          readinessProbe:           # first load done, and not shutting down
            httpGet: {path: /ready, port: mcp}
            periodSeconds: 5
          lifecycle:
            # Gives the ingress time to remove the pod before SIGTERM.
            # (Native `sleep` action: Kubernetes >= 1.30; the distroless image has no shell.)
            preStop:
              sleep: {seconds: 5}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: config
          configMap: {name: mcportal-config}
---
apiVersion: v1
kind: Service
metadata:
  name: mcportal
  labels: {app: mcportal}
spec:
  selector: {app: mcportal}
  ports:
    - {name: mcp, port: 80, targetPort: mcp}
    - {name: metrics, port: 9090, targetPort: metrics}   # do not expose through the ingress
