# MCPortal gateway registry.
# Every key is documented in src/config.rs.
gateway:
  name: SSP Gateway
  tool_search: {enabled: true, max_results: 5}
  # guide_path: guide-ssp.md is NOT enabled yet: that guide cites the insee, melodi, rmes and
  # geodata servers, which are not declared below (URLs to fill in). Served as is, it would
  # send the LLM to tools that do not exist. Add `guide_path: guide-ssp.md` back once those
  # servers are declared: the guide_drift test and a startup warning check the consistency.
  catalog: {enabled: true, include_tool_inventory: true, include_guide: true}
  health: {enabled: true, path: /health, probe_interval_seconds: 60, failure_threshold: 2}
  metrics: {log_level: INFO, json_logs: true, prometheus: {enabled: true, port: 9090}}
  concurrency: {acquire_timeout_seconds: 5}
  # Local default: loopback only, and Host header restricted (DNS rebinding protection).
  # In Kubernetes, the ConfigMap overrides this with bind 0.0.0.0:8000 (see deploy/kubernetes.yaml).
  http: {bind: "127.0.0.1:8000", path: /mcp, allowed_hosts: [localhost, 127.0.0.1, "::1"]}

servers:
  - name: mcpdiffusion                        # also used as the tool prefix
    url: https://mcpdiffusion.lab.sspcloud.fr/mcp
    transport: http                           # http | sse (sse: deprecated, not supported)
    domain: diffusion                         # functional grouping
    description: Server exposing Melodi, Rmes and insee.fr
    tags: [dataset, publications]             # list or single string
    enabled: true                             # false: kept in the registry, not exposed
    timeout: 30.0                             # timeout per upstream call (s)
    max_concurrency: 4                        # concurrent calls to this server
    cache_ttl: 300                            # tool list cache (s)

  # TODO: servers cited by guide-ssp.md, URLs to fill in:
  # - {name: insee,   url: …, domain: Insee}
  # - {name: melodi,  url: …, domain: Insee}
  # - {name: rmes,    url: …, domain: Insee}
  # - {name: geodata, url: …, domain: geographie}
